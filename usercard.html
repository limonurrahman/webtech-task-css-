    <title>User Card</title>
    <link rel="stylesheet" href="usercard.css">
</head>

<body>
    <div class="card">
        <h1>User Dashboard</h1>

            <h2 class="username">Siam Hossain</h2>
            <p class="userbio">Full-stack developer | Mchine Learning Enthusiast | Open source contributor</p>
        </div>

        
        <div class="usercard">
            <div class="badgenew">Online</div>
            <img src="https://scontent.fdac191-1.fna.fbcdn.net/v/t39.30808-1/422776495_3549059182000289_6248285126457166288_n.jpg?stp=dst-jpg_s200x200_tt6&_nc_cat=105&cb2=99be929b-bd9a46d7&ccb=1-7&_nc_sid=e99d92&_nc_aid=0&_nc_ohc=uAeUs6soNjIQ7kNvwFiuddD&_nc_oc=AdkDYKb431XSD_V3o10Au6jfFgDrqROpT_YqIZbfKv1gAT_EhRgDThJhS2Jex-68TFs&_nc_zt=24&_nc_ht=scontent.fdac191-1.fna&_nc_gid=32LkyNEIHWTfGol-UVyxNQ&oh=00_Aflk1fKXWwm4RbQz_ZFay7G0TiTyuaj32TcSujtp2fOJlw&oe=69366310" alt="User Profile" class="profilephoto">
            <h2 class="username">Ashiqur Rahman</h2>
            <p class="userbio">UI/UX Designer | Passionate about user experience | Tech enthusiast</p>
        </div>
    </div>
</body>

</html>
